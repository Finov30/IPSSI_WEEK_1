version: '3.8'

services:
  # API FastAPI
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sirene-api
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - HDFS_HOST=sirene-hdfs-namenode
      - HDFS_PORT=8020
      - HDFS_PATH=/sirene_data
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    depends_on:
      hdfs-namenode:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sirene-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: sirene-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - sirene-network
    restart: unless-stopped

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: sirene-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - sirene-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # HDFS NameNode
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sirene-hdfs-namenode
    hostname: sirene-hdfs-namenode
    environment:
      - CLUSTER_NAME=sirene
    ports:
      - "9870:9870"
      - "9000:8020"
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    networks:
      - sirene-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # HDFS DataNode
  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sirene-hdfs-datanode
    hostname: sirene-hdfs-datanode
    environment:
      - SERVICE_PRECONDITION=sirene-hdfs-namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://sirene-hdfs-namenode:8020
    ports:
      - "9864:9864"
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    networks:
      - sirene-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9864/jmx?qry=Hadoop:service=DataNode,name=DataNodeInfo || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ETL Service (pour lancer l'ETL via Docker dans le meme reseau)
  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: sirene-etl
    environment:
      - HDFS_HOST=sirene-hdfs-namenode
      - HDFS_PORT=8020
      - REDIS_HOST=redis
      - ENVIRONMENT=development
      - DATASET_CSV_PATH=${DATASET_CSV_PATH:-./dataset/100k.csv}
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./src:/app/src
    depends_on:
      - hdfs-namenode
      - hdfs-datanode
      - redis
    networks:
      - sirene-network
    profiles:
      - etl  # Service optionnel, active avec --profile etl

  # Script de verification HDFS (pour executer check_hdfs_data dans Docker)
  check-hdfs:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: sirene-check-hdfs
    environment:
      - HDFS_HOST=sirene-hdfs-namenode
      - HDFS_PORT=8020
      - REDIS_HOST=redis
      - ENVIRONMENT=development
      - DATASET_CSV_PATH=${DATASET_CSV_PATH:-./dataset/100k.csv}
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./src:/app/src
    depends_on:
      - hdfs-namenode
      - hdfs-datanode
    networks:
      - sirene-network
    profiles:
      - check  # Service optionnel, active avec --profile check
    command: ["python", "scripts/check_hdfs_data.py"]

volumes:
  redis-data:
  hdfs-namenode-data:
  hdfs-datanode-data:

networks:
  sirene-network:
    driver: bridge
